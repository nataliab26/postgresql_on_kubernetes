---
- name: Check whether minikube profile is already running
  ansible.builtin.command:
    cmd: "minikube status --profile={{ minikube_profile }}"
  register: minikube_status
  changed_when: false
  failed_when: false

- name: Start minikube cluster
  ansible.builtin.command:
    argv:
      - minikube
      - start
      - "--profile={{ minikube_profile }}"
      - "--driver={{ minikube_driver }}"
      - "--nodes={{ minikube_nodes }}"
      - "--cpus={{ minikube_cpus }}"
      - "--memory={{ minikube_memory }}"
      - "--cni={{ minikube_cni }}" #scenariusz 2
  when: minikube_status.rc != 0

- name: Get minikube addons status
  ansible.builtin.command:
    cmd: "minikube addons list --profile={{ minikube_profile }} -o json"
  register: minikube_addons_out
  changed_when: false

- name: Enable minikube addons
  ansible.builtin.command:
    cmd: "minikube addons enable {{ item }} --profile={{ minikube_profile }}"
  loop: "{{ minikube_addons }}"
  when: (minikube_addons_out.stdout | from_json)[item].Status != 'enabled'

- name: Get cluster nodes
  ansible.builtin.command:
    cmd: "kubectl --context={{ minikube_profile }} get nodes -o wide"
  register: minikube_nodes_out
  changed_when: false

- name: Show cluster nodes
  ansible.builtin.debug:
    var: minikube_nodes_out.stdout_lines
